# Build the app image for linux/arm64 (the Hetzner VPS is ARM), push it to GHCR,
# then ask Coolify to deploy it. Builds happen here, not on the 4 GB VPS.
#
# Repo settings this workflow uses:
#   secrets.COOLIFY_TOKEN   Coolify API token with deploy permission
#   vars.COOLIFY_URL        e.g. https://coolify.estebanbasili.com
#   vars.COOLIFY_APP_UUID   Coolify application that runs ghcr.io/<owner>/<repo>
# Template from the infra repo (skills/coolify-app). For a Vite SPA add under docker/build-push-action:
#   build-args: |
#     VITE_API_URL=${{ vars.VITE_API_URL }}     (set the repo variable! an empty value overrides the default)
# The deploy job is skipped until COOLIFY_APP_UUID is set.
name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # read:packages for private GitHub Packages (repo needs "Manage Actions access" on the package); BuildKit secret, not a layer
          secrets: |
            npm_token=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && vars.COOLIFY_APP_UUID != ''
    runs-on: ubuntu-latest
    env:
      API: ${{ vars.COOLIFY_URL }}/api/v1
      APP: ${{ vars.COOLIFY_APP_UUID }}
      AUTH: "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"
    steps:
      - name: Point the Coolify app at this commit's image
        run: |
          curl -fsS -X PATCH -H "$AUTH" -H "Content-Type: application/json" \
            -d '{"docker_registry_image_tag":"${{ github.sha }}"}' "$API/applications/$APP"

      - name: Deploy and wait for the result
        run: |
          DEPLOY=$(curl -fsS -X POST -H "$AUTH" "$API/deploy?uuid=$APP&force=false" | jq -r '.deployments[0].deployment_uuid')
          echo "Coolify deployment $DEPLOY"
          for i in $(seq 1 60); do
            STATUS=$(curl -fsS -H "$AUTH" "$API/deployments/$DEPLOY" | jq -r '.status')
            echo "status: $STATUS"
            case "$STATUS" in
              finished) exit 0 ;;
              failed|cancelled*) exit 1 ;;
            esac
            sleep 10
          done
          echo "timed out waiting for Coolify"; exit 1
